type: charm
bases:
  - build-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures: ["amd64"]
    run-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures:
        - amd64
  - build-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures: ["arm64"]
    run-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures:
        - arm64
  - build-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures: ["ppc64el"]
    run-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures:
        - ppc64el
  - build-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures: ["s390x"]
    run-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures:
        - s390x
parts:
  charm:
    plugin: charm
    override-build: |
      craftctl default
      git -C $CRAFT_PROJECT_DIR rev-parse --short HEAD > version
    charm-binary-python-packages:
    - maturin
    build-packages:
    - git
    - libffi-dev
    - libssl-dev
    - pkg-config
    - rustc
    - cargo
